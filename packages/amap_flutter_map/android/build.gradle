// [vendored patch] 官方 3.0.0 的 build.gradle 是 2020 年配置（AGP 3.5.0 /
// compileSdk 29 / jcenter），无法在当前 Flutter 构建链下工作。这里镜像同源
// fork amap_map 1.0.15 已在本工程 CI 验证过的骨架：namespace、compileSdk 35、
// mavenCentral。
//
// [vendored patch · 三期 iOS-only 桩化] 本插件仅 iOS 启用：Android 侧
// 已无任何高德 SDK 依赖——原 `implementation 'com.amap.api:3dmap:8.1.0'`
// 依赖行、为它提取的 src/main/jniLibs/*.so（libAMapSDK_MAP_v8_1_0.so）、
// consumer-rules.pro（为 8.1.0 的 R8 缺失类规则）、
// useLibrary 'org.apache.http.legacy'（8.1.0 网络层需要）全部移除；
// Java 只剩不注册视图的桩插件类（见 AMapFlutterMapPlugin.java）。
// 安卓包自此不含任何高德地图原生代码与 .so。iOS 侧不受影响。
group 'com.amap.flutter.map'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:3.5.4'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace = "com.amap.flutter.map"
    compileSdkVersion 35

    defaultConfig {
        minSdkVersion 21
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
}
